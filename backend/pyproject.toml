[project]
name = "aihub"
version = "0.1.0"
description = "AI-Hub: one control plane for AI coding agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "keyring>=25",   # stores your own API keys in the OS keychain (Windows Credential Manager)
  "uv>=0.5",       # sets up Python for connected apps (downloads the right Python version itself)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aihub = "aihub.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aihub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
